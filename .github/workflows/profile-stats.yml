# GitHub Profile Stats Workflow
name: Update GitHub Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  profile-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate Profile Cards
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: cryptonexum
          cards: overview,lifetime,contributions,languages
          output-dir: assets
          themes: light,dark
          commit: true
          commit-message: "chore: update GitHub profile stats [skip ci]"
